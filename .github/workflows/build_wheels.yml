name: Build

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-26 is Apple Silicon (arm64).
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-26]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python on macOS
        if: runner.os == 'macOS'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: arm64

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.1.0

      - name: Build and verify wheels
        run: |
          python -m cibuildwheel --output-dir wheelhouse
          python scripts/release_checks.py verify-wheel-count wheelhouse
        env:
          CIBW_ARCHS: auto64  # Don't build 32 bits wheels
          CIBW_ARCHS_MACOS: arm64
          CIBW_BUILD: "cp312-* cp313-*  cp314-*"
          CIBW_SKIP: pp*  # Don't build pypy wheels
          CIBW_ENVIRONMENT: "ITZI_BDIST_WHEEL=1 NO_STABLE_ABI=1"  # Trigger generic compiler flags
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET=15.0
            ITZI_BDIST_WHEEL=1
            NO_STABLE_ABI=1
            CC=/usr/bin/clang
            CXX=/usr/bin/clang++
          CIBW_BEFORE_TEST: "pip install pytest pytest-benchmark pandas scipy"
          CIBW_TEST_SOURCES: tests scripts pyproject.toml
          CIBW_TEST_COMMAND: >  # Fast tests
            python -m pytest -m "not slow and not xarray" tests/

      - uses: actions/upload-artifact@v6
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v6
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
